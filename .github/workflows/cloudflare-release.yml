name: Cloudflare isolated release
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        default: staging
        description: Separate Cloudflare environment
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:security
      - run: bun run test:contracts
      - run: bun run test:hardening
      - run: bun run test:audit-witness
      - run: bun run test:security
      - run: bun run test:cloudflare
      - run: python -m unittest discover -s security-ops -p 'test_migration.py'
      - run: bun run build:cloudflare
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: node packages/web/node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run test:automatic-backup
      - run: bun run test:contract-ui
      - run: bun run test:blackbox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-blackbox-${{ github.sha }}
          path: packages/web/playwright-report
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-assets-${{ github.sha }}
          path: packages/web/dist
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/feat/cloudflare-independent' || github.ref == 'refs/heads/main'
    environment: cloudflare-${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-assets-${{ github.sha }}
          path: packages/web/dist
      - name: Validate isolated destination
        run: bun cloudflare/validate-config.ts
        env:
          CLOUDFLARE_RUNTIME_SECRETS: ${{ secrets.CLOUDFLARE_RUNTIME_SECRETS }}
          RUNABLE_DATABASE_HOST_SHA256: ${{ vars.RUNABLE_DATABASE_HOST_SHA256 }}
      - name: Upload environment secrets and deploy exact tested source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_RUNTIME_SECRETS: ${{ secrets.CLOUDFLARE_RUNTIME_SECRETS }}
          TARGET: ${{ inputs.target }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          printf '%s' "$CLOUDFLARE_RUNTIME_SECRETS" | bunx wrangler secret bulk --env "$TARGET"
          bunx wrangler deploy --env "$TARGET" --var "RELEASE_SHA:$GITHUB_SHA"
