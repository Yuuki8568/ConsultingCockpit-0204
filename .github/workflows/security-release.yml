name: Security tests and release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'test / deploy / rollback (deployment requires a provisioned dedicated runner)'
        type: choice
        options: [test, deploy, rollback]
        default: test
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: inputs.action != 'rollback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:security
      - run: bun run test:contracts
      - run: bun test security-ops/hardening-maintenance.test.ts
      - run: bun run test:hardening
      - run: bun run test:audit-witness
      - run: bun run test:security
      - run: bun run build:web
        env:
          VITE_APPLICATION_ID: ${{ vars.VITE_APPLICATION_ID }}
          VITE_RUNABLE_AUTH_ISSUER: ${{ vars.VITE_RUNABLE_AUTH_ISSUER }}
          VITE_WEBSITE_URL: ${{ vars.VITE_WEBSITE_URL }}
      - run: node packages/web/node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: node tests/mobile.browser.cjs
      - run: bun run test:automatic-backup
      - run: bun run test:contract-ui
      - run: bun run test:blackbox
      - name: Package exact tested commit
        run: |
          mkdir release
          git archive HEAD | tar -x -C release
          cp -R packages/web/dist release/packages/web/dist
          tar -czf cockpit-release.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-${{ github.sha }}
          path: cockpit-release.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blackbox-report
          path: packages/web/playwright-report
          retention-days: 7
  deploy:
    needs: verify
    if: ${{ false }}
    environment: production
    runs-on: [self-hosted, cockpit-deploy]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cockpit-${{ github.sha }}
      - name: Require configured authentication build values
        env:
          APP: ${{ vars.VITE_APPLICATION_ID }}
          ISSUER: ${{ vars.VITE_RUNABLE_AUTH_ISSUER }}
          SITE: ${{ vars.VITE_WEBSITE_URL }}
        run: test -n "$APP" && test -n "$ISSUER" && test -n "$SITE"
      - name: Activate tested release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          tar -xzf cockpit-release.tar.gz security-ops/deploy-release.sh
          bash security-ops/deploy-release.sh deploy "$PWD/cockpit-release.tar.gz" "$RELEASE_SHA"
  rollback:
    if: ${{ false }}
    environment: production
    runs-on: [self-hosted, cockpit-deploy]
    steps:
      - uses: actions/checkout@v4
      - run: bash security-ops/deploy-release.sh rollback
  hardening-connection-preflight:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/security-hardening-20261101'
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    steps:
      - name: Check existing protected database configuration without revealing credentials
        env:
          COCKPIT_CONFIGURATION: ${{ secrets.CLOUDFLARE_RUNTIME_SECRETS }}
        run: |
          node <<'NODE'
          let config;
          try { config=JSON.parse(process.env.COCKPIT_CONFIGURATION||'{}'); }
          catch { console.log('PRECHECK: deployment configuration is not valid JSON'); process.exit(0); }
          const hasDatabase=typeof config.DATABASE_URL==='string'&&config.DATABASE_URL.startsWith('libsql://');
          const hasToken=typeof config.DATABASE_AUTH_TOKEN==='string'&&config.DATABASE_AUTH_TOKEN.length>0;
          const correctSite=config.WEBSITE_URL==='https://cockpit.yamashirogyomukaizen.com';
          console.log(JSON.stringify({databaseConfigured:hasDatabase,tokenConfigured:hasToken,correctSite,ready:hasDatabase&&hasToken&&correctSite}));
          NODE
